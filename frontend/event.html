<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details | 🌸 CampusEvents</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-content">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon">🌸</span>
        <span>CampusEvents</span>
        <span class="logo-sub">Sakura</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="btn btn-outline" style="padding: 7px 14px; font-size: 0.85rem;">← 🌸 Back to Events</a>
        <div id="nav-auth-container">
          <!-- Rendered dynamically by auth.js -->
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="event-detail-wrapper" class="dashboard-section" style="margin: 35px 0;">
      <div class="empty-state">
        <div class="kaomoji-icon">( ˶•ᴗ•˶ )</div>
        <h3>Loading event details...</h3>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 CampusEvents &bull; 🌸 Sakura & Kawaii Edition &bull; University Event Portal</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function loadEventDetail() {
      const wrapper = document.getElementById('event-detail-wrapper');
      const urlParams = new URLSearchParams(window.location.search);
      const eventId = urlParams.get('id');

      if (!eventId) {
        wrapper.innerHTML = `
          <div class="empty-state">
            <div class="kaomoji-icon">(｡•́︿•̀｡)</div>
            <h3>Event Not Specified</h3>
            <p>Please select an event from the campus catalog.</p>
            <a href="index.html" class="btn btn-primary" style="margin-top: 15px;">Return to Event Catalog 🌸</a>
          </div>
        `;
        return;
      }

      const res = await api.events.getById(eventId);

      if (!res.success || !res.data) {
        wrapper.innerHTML = `
          <div class="empty-state">
            <div class="kaomoji-icon">(｡•́︿•̀｡)</div>
            <h3>Event Record Not Found</h3>
            <p>${res.message || 'The requested event record could not be retrieved.'}</p>
            <a href="index.html" class="btn btn-primary" style="margin-top: 15px;">Browse Active Events 🌸</a>
          </div>
        `;
        return;
      }

      const evt = res.data;
      const dateStr = evt.date ? new Date(evt.date).toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) : 'Date TBD';
      const timeStr = evt.time || 'Schedule TBD';
      const category = evt.category || 'General';
      const capacity = evt.capacity !== undefined ? evt.capacity : 100;
      const registered = evt.registeredCount || 0;
      const pct = Math.min(100, Math.round((registered / capacity) * 100));

      const user = TokenStorage.getUser();
      const token = TokenStorage.getToken();

      let actionAreaHTML = '';

      if (!token || !user) {
        actionAreaHTML = `
          <div style="background-color: var(--sakura-pink-light); border: 1.5px solid var(--sakura-pink-border); border-radius: var(--radius-md); padding: 24px; text-align: center; margin-top: 30px;">
            <div style="font-size: 1.8rem; margin-bottom: 8px;">🌸</div>
            <h4 style="font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--sumi-slate); margin-bottom: 6px;">
              Student Sign In Required to RSVP
            </h4>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 18px; max-width: 480px; margin-left: auto; margin-right: auto;">
              Sign in with your student credentials to reserve your spot and receive entry credentials.
            </p>
            <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
              <a href="login.html?role=student" class="btn btn-primary">🎓 Student Sign In</a>
              <a href="register.html" class="btn btn-outline">Create Account 🌸</a>
            </div>
          </div>
        `;
      } else if (user.role === 'student') {
        actionAreaHTML = `
          <div style="margin-top: 30px; padding-top: 24px; border-top: 1.5px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
            <div>
              <h4 style="font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--sumi-slate);">
                Reserve Your Spot 🌸
              </h4>
              <p style="color: var(--text-muted); font-size: 0.88rem;">Free admission for all verified campus scholars. 🌸</p>
            </div>
            <button id="rsvp-btn" class="btn btn-primary" style="padding: 12px 28px; font-size: 0.95rem; font-weight: 700;">
              Confirm Event Registration 🌸
            </button>
          </div>
        `;
      } else {
        actionAreaHTML = `
          <div style="background-color: var(--fuji-lavender-light); border: 1.5px solid var(--fuji-lavender-border); border-radius: var(--radius-md); padding: 20px 24px; margin-top: 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <div>
              <span class="badge badge-purple" style="margin-bottom: 6px;">👑 Organizer View</span>
              <p style="font-size: 0.9rem; color: var(--text-muted);">You are viewing this event with administrative management privileges.</p>
            </div>
            <a href="organizer.html" class="btn btn-admin">Open Organizer Console 👑</a>
          </div>
        `;
      }

      let catClass = 'badge-sakura';
      if (category === 'Tech') catClass = 'badge-blue';
      if (category === 'Gaming') catClass = 'badge-purple';
      if (category === 'Sports') catClass = 'badge-orange';
      if (category === 'Workshops') catClass = 'badge-green';

      wrapper.innerHTML = `
        <div style="border-bottom: 1.5px solid var(--border-color); padding-bottom: 20px; margin-bottom: 24px;">
          <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
            <span class="badge ${catClass}">${escapeHTML(category)}</span>
            <span class="badge badge-gray">👥 ${registered} / ${capacity} spots filled</span>
          </div>
          <h1 style="font-family: var(--font-display); font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 800; color: var(--sumi-slate); line-height: 1.3;">
            ${escapeHTML(evt.title)}
          </h1>
        </div>

        <div style="margin-bottom: 24px;">
          <div class="capacity-meter-header">
            <span>Roster Capacity</span>
            <span>${pct}% filled (${registered} / ${capacity})</span>
          </div>
          <div class="capacity-track" style="height: 10px;">
            <div class="capacity-fill ${pct >= 90 ? 'full' : ''}" style="width: ${pct}%;"></div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 28px;">
          <div class="event-meta" style="margin-bottom: 0;">
            <span style="font-size: 0.76rem; text-transform: uppercase; font-weight: 700; color: var(--text-light);">📅 Date</span>
            <span style="font-size: 0.95rem; font-weight: 700; color: var(--sumi-slate);">${dateStr}</span>
          </div>
          <div class="event-meta" style="margin-bottom: 0;">
            <span style="font-size: 0.76rem; text-transform: uppercase; font-weight: 700; color: var(--text-light);">⏰ Schedule</span>
            <span style="font-size: 0.95rem; font-weight: 700; color: var(--sumi-slate);">${escapeHTML(timeStr)}</span>
          </div>
          <div class="event-meta" style="margin-bottom: 0;">
            <span style="font-size: 0.76rem; text-transform: uppercase; font-weight: 700; color: var(--text-light);">📍 Campus Venue</span>
            <span style="font-size: 0.95rem; font-weight: 700; color: var(--sumi-slate);">${escapeHTML(evt.location || 'Campus Main Ground')}</span>
          </div>
        </div>

        <div>
          <h3 style="font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; color: var(--sumi-slate); margin-bottom: 12px;">
            Event Overview & Agenda 🌸
          </h3>
          <div style="font-size: 0.96rem; line-height: 1.7; color: var(--text-main); white-space: pre-line;">
            ${escapeHTML(evt.description || 'Join campus peers for this engaging event.')}
          </div>
        </div>

        ${actionAreaHTML}
      `;

      // Attach RSVP listener
      const rsvpBtn = document.getElementById('rsvp-btn');
      if (rsvpBtn) {
        rsvpBtn.addEventListener('click', async () => {
          rsvpBtn.disabled = true;
          rsvpBtn.innerHTML = 'Reserving your spot... 🌸';

          const regRes = await api.registrations.register(eventId);

          if (regRes.success) {
            showToast(regRes.message || 'Registration confirmed! See you at the event 🌸', 'success');
            rsvpBtn.className = 'btn btn-outline';
            rsvpBtn.innerHTML = 'Registration Confirmed 🌸 ✓';
            setTimeout(() => {
              window.location.href = 'student.html';
            }, 1200);
          } else {
            showToast(regRes.message || 'Unable to register (event may be full or already registered).', 'error');
            rsvpBtn.disabled = false;
            rsvpBtn.innerHTML = 'Retry Registration 🌸';
          }
        });
      }
    }

    document.addEventListener('DOMContentLoaded', loadEventDetail);
  </script>
</body>
</html>
